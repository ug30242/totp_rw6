name: Publish web importer (enable Pages first)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run web:build
      - name: Stage only the standalone importer
        run: |
          mkdir -p /tmp/totp-pages
          cp web/index.html /tmp/totp-pages/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/totp-pages
      - uses: actions/deploy-pages@v4
